<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — NovaShield</title>
  <meta name="description"
    content="Sign in to your NovaShield account to access your rider dashboard and safety features." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="auth-page">
    <div class="card card-elevated auth-card">
      <a href="index.html" class="auth-back-link">← Back to Home</a>

      <div style="text-align:center;margin-bottom:24px;">
        <div class="navbar-logo" style="margin:0 auto 12px;width:48px;height:48px;font-size:1.3rem;">N</div>
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your NovaShield account</p>
      </div>

      <form id="auth-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="auth-email">Email Address</label>
          <input required type="email" id="auth-email" placeholder="rider@example.com" class="form-input"
            autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="auth-password">Password</label>
          <input required type="password" id="auth-password" placeholder="••••••••" class="form-input"
            autocomplete="current-password" minlength="6" />
        </div>

        <div id="auth-error" class="form-error"></div>
        <div id="auth-success" class="form-success"></div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="auth-btn">
          <span id="auth-btn-label">Sign In</span>
        </button>
      </form>

      <div class="auth-divider">OR</div>

      <div class="auth-link-row">
        New rider? <a href="onboarding.html">Create your account →</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { API_URL, saveAuthData } from './api-config.js';

    // If already logged in, redirect
    if (localStorage.getItem('ns_token')) {
      window.location.href = 'dashboard.html';
    }

    const btnLabel = document.getElementById('auth-btn-label');
    const authForm = document.getElementById('auth-form');
    const errorEl = document.getElementById('auth-error');
    const successEl = document.getElementById('auth-success');
    const authBtn = document.getElementById('auth-btn');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      successEl.style.display = 'none';
    }

    function showSuccess(msg) {
      successEl.textContent = msg;
      successEl.style.display = 'block';
      errorEl.style.display = 'none';
    }




    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;

      if (!email || !password) {
        showError('Please fill in all fields.');
        return;
      }

      authBtn.disabled = true;
      btnLabel.textContent = 'Authenticating...';
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.detail || 'Login failed.');
        }

        const data = await response.json();
        saveAuthData(data);

        showSuccess(`Welcome back, ${data.name || 'Rider'}! Redirecting...`);
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);

      } catch (error) {
        console.error('[AUTH ERROR]', error);
        authBtn.disabled = false;
        btnLabel.textContent = 'Sign In';
        showError(error.message);
      }
    });
  </script>
</body>

</html>
