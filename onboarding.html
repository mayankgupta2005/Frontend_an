<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Account — NovaShield</title>
  <meta name="description" content="Create your NovaShield rider profile for smart two-wheeler safety." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="auth-page">
    <div class="card card-elevated auth-card" style="max-width:540px;">
      <a href="index.html" class="auth-back-link" id="back-link">← Back to Home</a>

      <div style="text-align:center;margin-bottom:24px;">
        <div class="navbar-logo" style="margin:0 auto 12px;width:48px;height:48px;font-size:1.3rem;">N</div>
        <h2 id="page-title">Create Your Account</h2>
        <p class="auth-subtitle" id="page-sub">Set up your NovaShield rider profile</p>
      </div>

      <form id="rider-form" class="auth-form" style="max-height:65vh;overflow-y:auto;padding-right:8px;">

        <!-- Account Credentials (hidden in edit mode) -->
        <div id="auth-section">
          <p
            style="font-size:0.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">
            Account Credentials</p>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" name="email" id="reg-email" placeholder="rider@example.com" class="form-input" />
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input type="password" name="password" id="reg-password" placeholder="Min. 6 characters" class="form-input"
              minlength="6" autocomplete="new-password" />
          </div>

          <p
            style="font-size:0.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin:8px 0 4px;">
            Rider Profile</p>
        </div>

        <!-- Rider Profile Fields -->
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input required type="text" name="name" placeholder="Enter your full name" class="form-input" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Age</label>
            <input required type="number" name="age" placeholder="27" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-input">
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
              <option>Prefer not to say</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Blood Group</label>
            <select name="bloodGroup" class="form-input">
              <option>A+</option>
              <option>A-</option>
              <option>B+</option>
              <option>B-</option>
              <option>AB+</option>
              <option>AB-</option>
              <option selected>O+</option>
              <option>O-</option>
            </select>
          </div>
          <div class="form-group" id="profile-email-wrap" style="display:none;">
            <label class="form-label">Email (read-only)</label>
            <input type="email" name="emailDisplay" id="profile-email-display" class="form-input" readonly
              style="opacity:0.6;cursor:default;" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Mobile Number</label>
            <input required type="tel" name="mobile" placeholder="+91 80000 00000" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Emergency Contact</label>
            <input required type="tel" name="emergency" placeholder="+91 90000 00000" class="form-input" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Address</label>
          <input required type="text" name="address" placeholder="123 Sector 4, Cyber City" class="form-input" />
        </div>

        <div class="form-group">
          <label class="form-label">Health Issues (optional)</label>
          <input type="text" name="healthIssues" placeholder="e.g. Asthma, Hypertension" class="form-input" />
        </div>

        <div class="form-group">
          <label class="form-label">Allergies (optional)</label>
          <input type="text" name="allergies" placeholder="e.g. Penicillin, Peanuts" class="form-input" />
        </div>

        <div id="form-error" class="form-error"></div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="submit-btn">
          <span id="btn-label">Create Account</span>
        </button>
      </form>

      <div class="auth-link-row" id="signin-row" style="margin-top:16px;">
        Already have an account? <a href="login.html">Sign In →</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { API_URL, getAuthHeaders, saveAuthData } from './api-config.js';

    let isEditMode = !!localStorage.getItem('ns_token');
    let currentUser = {
      uid: localStorage.getItem('ns_user_id'),
      email: ''
    };

    const form = document.getElementById('rider-form');
    const btn = document.getElementById('submit-btn');
    const btnLabel = document.getElementById('btn-label');
    const authSection = document.getElementById('auth-section');
    const errorEl = document.getElementById('form-error');
    const signinRow = document.getElementById('signin-row');
    const pageTitle = document.getElementById('page-title');
    const pageSub = document.getElementById('page-sub');
    const backLink = document.getElementById('back-link');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    function clearError() {
      errorEl.style.display = 'none';
    }

    // Detect if user is already logged in → edit profile mode
    async function initMode() {
      if (isEditMode) {
        // Switch UI to Edit Profile mode
        pageTitle.textContent = 'Edit Rider Profile';
        pageSub.textContent = 'Update your NovaShield rider information';
        backLink.href = 'dashboard.html';
        backLink.textContent = '← Back to Dashboard';
        btnLabel.textContent = 'Save Changes';
        authSection.style.display = 'none';
        signinRow.style.display = 'none';

        // Pre-fill existing profile data
        try {
          const res = await fetch(`${API_URL}/medical?user_id=${currentUser.uid}`, {
            headers: getAuthHeaders()
          });
          if (res.ok) {
            const d = await res.json();

            // Show read-only email (assuming we might not have it in medical, but we can set it if available)
            const emailWrap = document.getElementById('profile-email-wrap');
            const emailDisplay = document.getElementById('profile-email-display');
            if (emailWrap) emailWrap.style.display = 'block';
            if (emailDisplay) emailDisplay.value = currentUser.email || '';

            form.querySelector('[name="name"]').value = d.full_name || '';
            form.querySelector('[name="age"]').value = d.age || ''; // Note: MedicalProfile uses dob, but let's keep frontend mapping simple
            form.querySelector('[name="bloodGroup"]').value = d.blood_group || 'O+';
            form.querySelector('[name="emergency"]').value = d.emergency_contact_phone || '';
            form.querySelector('[name="healthIssues"]').value = d.conditions || '';
            form.querySelector('[name="allergies"]').value = d.allergies || '';
            // mobile, address, gender might not map directly to MedicalProfile in backend OpenAPI, we just store what we can in notes or leave them out if not mapped.
          }
        } catch (e) {
          console.warn('[Profile] Could not pre-fill:', e);
        }
      }
    }

    initMode();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const data = Object.fromEntries(new FormData(form).entries());
      delete data.password;
      delete data.emailDisplay;

      btn.disabled = true;

      if (isEditMode) {
        btnLabel.textContent = 'Saving...';
        try {
          const payload = {
            user_id: currentUser.uid,
            full_name: data.name,
            blood_group: data.bloodGroup,
            allergies: data.allergies,
            conditions: data.healthIssues,
            emergency_contact_phone: data.emergency,
            notes: `Mobile: ${data.mobile}, Address: ${data.address}, Age: ${data.age}, Gender: ${data.gender}`
          };
          const res = await fetch(`${API_URL}/medical`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error('Save failed');

          btnLabel.textContent = '✓ Saved — Redirecting';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
        } catch (err) {
          btn.disabled = false;
          btnLabel.textContent = 'Save Changes';
          showError('Error saving profile. Check your connection and try again.');
        }
      } else {
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;

        if (!email || !password) {
          btn.disabled = false;
          showError('Please enter your email and password to create an account.');
          return;
        }
        if (password.length < 6) {
          btn.disabled = false;
          showError('Password must be at least 6 characters.');
          return;
        }
        if (!data.name || !data.mobile || !data.emergency || !data.address) {
          btn.disabled = false;
          showError('Please fill in all required rider profile fields.');
          return;
        }

        btnLabel.textContent = 'Creating account...';

        try {
          // 1. Register User
          const regRes = await fetch(`${API_URL}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, name: data.name })
          });
          if (!regRes.ok) {
            const errData = await regRes.json();
            throw new Error(errData.detail || 'Registration failed');
          }

          // 2. Login User to get token
          const loginRes = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          if (!loginRes.ok) throw new Error('Auto-login failed after registration');
          const authData = await loginRes.json();
          saveAuthData(authData);

          btnLabel.textContent = 'Syncing profile...';

          // 3. Save Medical Profile
          const payload = {
            user_id: authData.user_id,
            full_name: data.name,
            blood_group: data.bloodGroup,
            allergies: data.allergies,
            conditions: data.healthIssues,
            emergency_contact_phone: data.emergency,
            notes: `Mobile: ${data.mobile}, Address: ${data.address}, Age: ${data.age}, Gender: ${data.gender}`
          };
          await fetch(`${API_URL}/medical`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify(payload)
          });

          btnLabel.textContent = '✓ All set — Launching Dashboard';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
        } catch (err) {
          btn.disabled = false;
          btnLabel.textContent = 'Create Account';
          showError(err.message || 'An error occurred. Please try again.');
        }
      }
    });
  </script>
</body>

</html>
